<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Новосибирск ⇄ Барнаул</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ac:#38bdf8;--ok:#22c55e}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#0284c7}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:0 16px 40px}
main{max-width:560px;margin:auto}h1{font-size:20px;margin:16px 0 12px}
.route{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:12px}
.route b{flex:1;text-align:center}button,input,select{font:inherit}
.swap{background:var(--ac);color:#fff;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer}
input[type=date],select{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:0;background:var(--card);color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--mut);background:none;color:var(--tx);cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.time{font-size:20px;font-weight:700}.price{font-size:18px;font-weight:700;color:var(--ok)}
.mut{color:var(--mut);font-size:14px}.det{display:none;margin-top:12px;border-top:1px solid #64748b44;padding-top:12px}
.card.open .det{display:block}
.stop{display:flex;gap:10px;padding:4px 0}.stop i{width:10px;height:10px;border-radius:50%;background:var(--ac);margin-top:6px;flex:none}
.stop span:first-of-type{width:48px;font-weight:600;flex:none}
.buy{display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;padding:12px;border-radius:12px;margin-top:12px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:20px}
</style></head><body><main>
<h1>Новосибирск ⇄ Барнаул</h1>
<div class="route"><b id="from"></b><button class="swap" id="swap" aria-label="Поменять направление">⇄</button><b id="to"></b></div>
<input type="date" id="date">
<div class="chips" id="chips"></div>
<select id="sort"><option value="dep">Сначала раннее отправление</option><option value="price">Сначала дешёвые</option><option value="dur">Сначала быстрые</option></select>
<div id="list"></div>
<p class="note">Прототип: расписание и цены примерные. Актуальные рейсы и покупка билета — по кнопке «Купить» на сайте продавца на выбранную дату.</p>
</main>
<script src="data.js"></script>
<script>
const NAMES={bus:"🚌 Автобус",train:"🚆 Поезд",plane:"✈️ Самолёт",ride:"🚗 Попутчики"};
const CITY={"nsk-brn":["Новосибирск","Барнаул"],"brn-nsk":["Барнаул","Новосибирск"]};
let dir="nsk-brn",type="all";
const $=id=>document.getElementById(id);
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
$("date").value=today;$("date").min=today;
const toMin=t=>{const[a,b]=t.split(":");return+a*60+ +b};
const fmt=m=>{m=(m%1440+1440)%1440;return String(m/60|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const dur=m=>(m/60|0)+" ч "+(m%60?m%60+" мин":"");
function render(){
  $("from").textContent=CITY[dir][0];$("to").textContent=CITY[dir][1];
  const date=$("date").value,wd=new Date(date+"T12:00:00").getDay();
  $("chips").innerHTML=["all",...Object.keys(NAMES)].map(k=>`<button class="chip ${k===type?"on":""}" data-k="${k}">${k==="all"?"Все":NAMES[k]}</button>`).join("");
  let r=TRIPS.filter(t=>t.dir===dir&&(type==="all"||t.type===type)&&(!t.days||t.days.includes(wd)));
  const s=$("sort").value;r.sort((a,b)=>s==="price"?a.price-b.price:s==="dur"?a.dur-b.dur:toMin(a.dep)-toMin(b.dep));
  $("list").innerHTML=r.map(t=>{
    const d0=toMin(t.dep),arr=d0+t.dur,next=arr>=1440?" (+1 день)":"";
    const stops=STOPS[t.type][dir].map(([n,f])=>`<div class="stop"><i></i><span>${fmt(d0+Math.round(t.dur*f))}</span><span>${n}</span></div>`).join("");
    return `<div class="card"><div class="top"><div><div class="time">${t.dep} → ${fmt(arr)}${next}</div><div class="mut">${NAMES[t.type]} · ${dur(t.dur)} · ${t.carrier}</div></div><div class="price">${t.price} ₽</div></div>
    <div class="det"><div class="mut" style="margin-bottom:8px">${t.vehicle}</div>${stops}<a class="buy" target="_blank" rel="noopener" href="${BUY[t.type](date,dir)}">Купить билет на ${date.split("-").reverse().join(".")}</a></div></div>`}).join("")||'<p class="mut">На эту дату рейсов нет.</p>';
}
$("list").onclick=e=>{const c=e.target.closest(".card");if(c&&!e.target.closest("a"))c.classList.toggle("open")};
$("chips").onclick=e=>{if(e.target.dataset.k){type=e.target.dataset.k;render()}};
$("swap").onclick=()=>{dir=dir==="nsk-brn"?"brn-nsk":"nsk-brn";render()};
$("date").onchange=render;$("sort").onchange=render;render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
